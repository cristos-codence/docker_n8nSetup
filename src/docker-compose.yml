services:
  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - NODE_ENV=production
      - NODEJS_PREFER_IPV4=true
      - N8N_SECURE_COOKIE=false
      - N8N_PROTOCOL=http
    volumes:
      - $HOME/Documents/n8n_docker_files:/home/node/.n8n
    networks:
      - traefik_net
    command: "start --tunnel"

networks:
  traefik_net:
    external: true
